<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Shop - Review Report</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-5">
    <div class="container">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                <h4 class="m-0">Smart Shop - Review Report</h4>
                <button class="btn btn-primary btn-sm" onclick="loadReport()">Refresh Data</button>
            </div>
            <div class="card-body p-0">
                <table class="table table-striped table-hover m-0">
                    <thead class="table-secondary">
                        <tr>
                            <th>No</th>
                            <th>Product name</th>
                            <th>Total reviews</th>
                            <th>Positive</th>
                            <th>Negative</th>
                            <th>Neutral</th>
                            <th>Average rating</th>
                        </tr>
                    </thead>
                    <tbody id="reportData">
                        <tr><td colspan="7" class="text-center py-4">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadReport() {
            try {
                const res = await fetch('/api/reports/reviews');
                const data = await res.json();
                const tbody = document.getElementById('reportData');

                if (!data.length) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4">No reviews recorded yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(item => `
                    <tr>
                        <td>${item.no}</td>
                        <td><strong>${item.productName}</strong></td>
                        <td>${item.totalReviews}</td>
                        <td><span class="badge bg-success">${item.positive}</span></td>
                        <td><span class="badge bg-danger">${item.negative}</span></td>
                        <td><span class="badge bg-secondary">${item.neutral}</span></td>
                        <td><strong>${item.averageRating.toFixed(1)}</strong> / 5.0</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }
        loadReport();
    </script>
</body>
</html>
